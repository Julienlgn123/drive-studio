name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          # macos-latest = runner Apple Silicon (arm64) natif : le build arm64
          # est compilé nativement, aucune traduction Rosetta n'est utilisée.
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe les dépendances (+ recompile better-sqlite3 pour Electron)
        run: npm ci

      - name: Build main/preload/renderer
        run: npm run build

      - name: Package (${{ matrix.platform }}, x64 + arm64)
        run: npx electron-builder --${{ matrix.platform }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload des artefacts (runs manuels, hors tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist-installer/*.exe
            dist-installer/*.dmg
            dist-installer/*.zip
            dist-installer/*.AppImage
            dist-installer/*.deb
          if-no-files-found: ignore
